# Builds the Windows installer and publishes it as a GitHub Release.
# Installed copies of Bliscord check these releases and update themselves.
#
# To ship an update:
#   1. Bump "version" in package.json (e.g. 1.0.1)
#   2. Add an entry for it to src/changelog.json
#   3. git commit -am "v1.0.1" && git tag v1.0.1 && git push --follow-tags
#
# Optional: set a repository variable BLISCORD_SERVER_URL (Settings > Secrets and
# variables > Actions > Variables) so the installer connects to your server by default.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Point the app at the production server
        if: ${{ vars.BLISCORD_SERVER_URL != '' }}
        env:
          SERVER_URL: ${{ vars.BLISCORD_SERVER_URL }}
        run: |
          node -e "const fs = require('fs'); const c = JSON.parse(fs.readFileSync('app.config.json', 'utf8')); c.serverUrl = process.env.SERVER_URL; fs.writeFileSync('app.config.json', JSON.stringify(c, null, 2));"

      - run: npx vite build

      - run: node scripts/release-notes.mjs

      # Create the release up front. electron-builder uploads files in parallel and,
      # if no release exists yet, each upload creates its own (duplicate) release.
      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; do gh release delete "$GITHUB_REF_NAME" --yes; done
          gh release create "$GITHUB_REF_NAME" --title "Bliscord ${GITHUB_REF_NAME#v}" --notes-file build/release-notes.md

      - name: Build installer and publish release
        shell: bash
        run: npx electron-builder --win --publish always -c.publish.owner=${{ github.repository_owner }} -c.publish.repo=${{ github.event.repository.name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
